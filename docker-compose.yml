version: '3.8'

services:
  autoguild:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoguild
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DATABASE_PATH=/app/data/autoguild.db
    volumes:
      # Persist database
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs
      # WhatsApp session (if using WhatsApp)
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./.wwebjs_cache:/app/.wwebjs_cache
    ports:
      # Web dashboard (optional)
      - "${DASHBOARD_PORT:-3000}:3000"
    networks:
      - autoguild-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.autoguild.description=AutoGuild multi-platform bot"
      - "com.autoguild.version=1.0.0"

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: autoguild-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - autoguild-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: autoguild-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    networks:
      - autoguild-network
    profiles:
      - monitoring
    depends_on:
      - prometheus

  # Local LLM Service (CPU / Mac)
  ollama:
    image: ollama/ollama:latest
    container_name: autoguild-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - autoguild-network
    profiles:
      - llm
      - cpu

  # Local LLM Service (NVIDIA GPU)
  ollama-gpu:
    image: ollama/ollama:latest
    container_name: autoguild-ollama-gpu
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - autoguild-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

  # Core Database (CockroachDB)
  cockroach:
    image: cockroachdb/cockroach:latest
    container_name: autoguild-cockroach
    restart: unless-stopped
    command: start-single-node --insecure
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    ports:
      - "26257:26257"
      - "8080:8080"
    networks:
      - autoguild-network
    profiles:
      - db

  # Cache & Queues (Redis)
  redis:
    image: redis:alpine
    container_name: autoguild-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - autoguild-network
    profiles:
      - db

  # Vector Database (Weaviate)
  weaviate:
    image: semitechnologies/weaviate:1.24.1
    container_name: autoguild-weaviate
    ports:
      - "8081:8080"
      - "50051:50051"
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - autoguild-network
    profiles:
      - db

networks:
  autoguild-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  ollama-data:
  cockroach-data:
  redis-data:
  weaviate-data:
