version: '3.8'

services:
  autoguild:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoguild
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DATABASE_PATH=/app/data/autoguild.db
    volumes:
      # Persist database
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs
      # WhatsApp session (if using WhatsApp)
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./.wwebjs_cache:/app/.wwebjs_cache
    ports:
      # Web dashboard (optional)
      - "${DASHBOARD_PORT:-3000}:3000"
    networks:
      - autoguild-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.autoguild.description=AutoGuild multi-platform bot"
      - "com.autoguild.version=1.0.0"

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: autoguild-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - autoguild-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: autoguild-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    networks:
      - autoguild-network
    profiles:
      - monitoring
    depends_on:
      - prometheus

networks:
  autoguild-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
